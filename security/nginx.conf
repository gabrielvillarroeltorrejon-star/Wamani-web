# ==============================================================================
# CONFIGURACIÓN DE SEGURIDAD Y RENDIMIENTO NGINX - WAMANI EXPERIENCE
# ==============================================================================

# 1. Redirección forzada de HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name wamani.cl www.wamani.cl;

    # Permitir renovación automática de certificados SSL Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Principal Seguro (HTTPS con HTTP/2)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wamani.cl www.wamani.cl;

    # Certificados SSL / TLS
    ssl_certificate /etc/letsencrypt/live/wamani.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wamani.cl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Raíz del Frontend compilado (dist)
    root /var/www/wamani-frontend/dist;
    index index.html;

    # ==========================================================================
    # CABECERAS DE CIBERSEGURIDAD ESTRICTAS (SECURITY HEADERS)
    # ==========================================================================
    
    # HSTS: Obliga a los navegadores a usar HTTPS durante 1 año
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # X-Frame-Options: Previene ataques de Clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # X-Content-Type-Options: Previene ataques de MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer-Policy: Controla la información de referencia enviada
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Permissions-Policy: Restringe accesos a APIs del dispositivo
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;

    # Content-Security-Policy (CSP)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://elfsightcdn.com https://translate.google.com https://translate.googleapis.com https://webpay3gint.transbank.cl https://webpay3g.transbank.cl; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; img-src 'self' data: https: blob:; connect-src 'self' https: http://localhost:3001; frame-src 'self' https://elfsightcdn.com https://translate.google.com https://webpay3gint.transbank.cl https://webpay3g.transbank.cl;" always;

    # ==========================================================================
    # OPTIMIZACIONES DE VELOCIDAD Y COMPRESIÓN (GZIP)
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cache de estáticos (Imágenes, Fonts, CSS, JS)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Enrutamiento SPA (Vue Router en modo History)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia la API Backend de Transbank
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
